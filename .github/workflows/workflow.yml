name: CI

on:
  push:
    branches:
      - main
      - training-lab
  # Optional: build on PRs too (remove if not needed)
  pull_request:
    branches:
      - main
      - training-lab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for GHCR; not needed for ACR, but harmless to keep explicit
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      # --- Docker build & push to ACR ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Optional: infer tags/labels (nice metadata)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.ACR_LOGIN_SERVER }}/album-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push album-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile          # adjust if your Dockerfile is elsewhere
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max